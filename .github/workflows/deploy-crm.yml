name: Deploy CRM to AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        default: production
        type: choice
        options:
          - production

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::072508717210:role/movira-github-actions-deploy
  ARTIFACT_BUCKET: movira-deploy-072508717210-ap-south-1
  INSTANCE_ID: i-04b24ccadd1321a1c

jobs:
  deploy:
    name: Package and deploy CRM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: |
          node --check config/config.js
          node --check src/config/index.js
          node --check src/db/sequelize.js
          node --check src/server.js
          node --check src/workers/transactionalWorker.js
          node --check src/workers/marketingWorker.js
          node --check src/workers/marketingAudienceWorker.js
          node --check src/workers/sesWebhookWorker.js
          node --check src/workers/senderWarmupWorker.js
          node --check src/workers/contactsWorker.js
          node --check src/workers/segmentsWorker.js
          node --check src/workers/automationWorker.js

      - name: Test
        run: npm test

      - name: Package CRM
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='*.log' \
            -czf /tmp/crm.tar.gz .

      - name: Upload artifact
        run: aws s3 cp /tmp/crm.tar.gz "s3://${ARTIFACT_BUCKET}/crm.tar.gz"

      - name: Deploy CRM on EC2
        run: |
          cat > /tmp/movira-crm-remote.sh <<REMOTE
          set -euo pipefail

          aws s3 cp s3://${ARTIFACT_BUCKET}/crm.tar.gz /tmp/movira-crm.tar.gz --region ${AWS_REGION}

          rm -rf /opt/movira/crm.release
          mkdir -p /opt/movira/crm.release
          tar --warning=no-unknown-keyword -xzf /tmp/movira-crm.tar.gz -C /opt/movira/crm.release

          if [ -f /opt/movira/crm/.env ]; then
            cp /opt/movira/crm/.env /tmp/movira-crm.env
          fi

          rm -rf /opt/movira/crm.previous
          if [ -d /opt/movira/crm ]; then
            mv /opt/movira/crm /opt/movira/crm.previous
          fi

          mv /opt/movira/crm.release /opt/movira/crm

          if [ -f /tmp/movira-crm.env ]; then
            cp /tmp/movira-crm.env /opt/movira/crm/.env
          fi

          cd /opt/movira/crm
          npm install --no-audit --no-fund
          npm run migrate
          npm run seed
          PENDING_MIGRATIONS="\$(npx sequelize-cli db:migrate:status | awk '\$1 == "down" { count += 1 } END { print count + 0 }')"
          if [ "\${PENDING_MIGRATIONS}" -ne 0 ]; then
            echo "CRM deployment blocked: \${PENDING_MIGRATIONS} pending migration(s)."
            exit 1
          fi
          for app in \
            movira-crm \
            movira-crm-transactional-worker \
            movira-crm-marketing-worker \
            movira-crm-marketing-audience-worker \
            movira-crm-webhooks-worker \
            movira-crm-warmup-worker \
            movira-crm-contacts-worker \
            movira-crm-segments-worker \
            movira-crm-automation-worker
          do
            pm2 delete "\${app}" >/dev/null 2>&1 || true
          done

          CRM_HEALTH_PORT=4100
          if [ -f .env ]; then
            CRM_ENV_PORT=\$(awk -F= '/^[[:space:]]*PORT[[:space:]]*=/{print \$2}' .env | tail -n 1 | tr -d ' "\r')
            if [ -n "\${CRM_ENV_PORT}" ]; then
              CRM_HEALTH_PORT="\${CRM_ENV_PORT}"
            fi
          fi

          pm2 start src/server.js --name movira-crm --time
          sleep 3
          pm2 status movira-crm
          echo "Waiting for movira-crm health check on port \${CRM_HEALTH_PORT}..."
          attempt=1
          until curl -fsS "http://127.0.0.1:\${CRM_HEALTH_PORT}/health"; do
            if [ "\$attempt" -ge 30 ]; then
              echo "movira-crm health check failed after \$attempt attempts on port \${CRM_HEALTH_PORT}"
              pm2 status movira-crm || true
              pm2 describe movira-crm || true
              pm2 logs movira-crm --lines 120 --nostream || true
              exit 1
            fi
            echo "movira-crm is not ready yet on port \${CRM_HEALTH_PORT}; retrying (\$attempt/30)..."
            attempt=\$((attempt + 1))
            sleep 2
          done

          pm2 start src/workers/transactionalWorker.js --name movira-crm-transactional-worker --time
          pm2 start src/workers/marketingWorker.js --name movira-crm-marketing-worker --time
          pm2 start src/workers/marketingAudienceWorker.js --name movira-crm-marketing-audience-worker --time
          pm2 start src/workers/sesWebhookWorker.js --name movira-crm-webhooks-worker --time
          pm2 start src/workers/senderWarmupWorker.js --name movira-crm-warmup-worker --time
          pm2 start src/workers/contactsWorker.js --name movira-crm-contacts-worker --time
          pm2 start src/workers/segmentsWorker.js --name movira-crm-segments-worker --time
          pm2 start src/workers/automationWorker.js --name movira-crm-automation-worker --time
          pm2 save
          systemctl restart nginx
          REMOTE

          jq -n --rawfile script /tmp/movira-crm-remote.sh '{commands: [$script]}' \
            > /tmp/movira-crm-ssm-commands.json

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Movira CRM from GitHub Actions" \
            --timeout-seconds 1800 \
            --parameters file:///tmp/movira-crm-ssm-commands.json \
            --query 'Command.CommandId' \
            --output text)"

          echo "Waiting for SSM command ${COMMAND_ID} to finish..."
          for attempt in $(seq 1 120); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/tmp/movira-crm-ssm-wait.err || true)"

            case "${STATUS}" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}"
                exit 1
                ;;
              InProgress|Pending|Delayed|"")
                echo "SSM command status: ${STATUS:-not ready} (${attempt}/120)"
                sleep 15
                ;;
              *)
                echo "Unexpected SSM command status: ${STATUS}"
                cat /tmp/movira-crm-ssm-wait.err || true
                sleep 15
                ;;
            esac
          done

          FINAL_STATUS="$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query 'Status' \
            --output text)"
          if [ "${FINAL_STATUS}" != "Success" ]; then
            echo "SSM command did not finish successfully within 30 minutes. Final status: ${FINAL_STATUS}"
            aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}"
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query '{Status:Status,ResponseCode:ResponseCode}'
